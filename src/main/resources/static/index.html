<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web API 服务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
        }
        .card h1 {
            font-size: 28px;
            color: #667eea;
            margin-bottom: 12px;
        }
        .card .version {
            display: inline-block;
            background: #667eea;
            color: #fff;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        .card .desc {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .card .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: #27ae60;
            margin-bottom: 32px;
        }
        .card .dot {
            width: 10px;
            height: 10px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .card .links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .card .links a {
            text-decoration: none;
            color: #667eea;
            border: 1px solid #667eea;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .card .links a:hover {
            background: #667eea;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Web API Service</h1>
        <div class="version">v1.0</div>
        <p class="desc">API 服务运行中，请通过接口文档进行调用。</p>
        <div class="status">
            <span class="dot"></span>
            <span>服务正常运行</span>
        </div>
        <div class="links">
            <a href="/apidoc">接口文档</a>
        </div>
    </div>
</body>
</html>
